services:
  ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ledger:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgresql://ledger:ledger@ledger:5432/ledger}
      CELESTO_PROVIDER: ${CELESTO_PROVIDER:-cloud}
      CELESTO_API_KEY: ${CELESTO_API_KEY:-replace-me}
      CELESTO_BACKEND: ${CELESTO_BACKEND:-firecracker}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://example-llm-host/v1}
      LLM_API_KEY: ${LLM_API_KEY:-replace-me}
      LLM_MODEL: ${LLM_MODEL:-replace-with-a-model-name}
      AGENT_EXECUTOR: ${AGENT_EXECUTOR:-celesto}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-pypi.org,files.pythonhosted.org}
      USE_LLM: ${USE_LLM:-0}
      LEDGER_URL: ${LEDGER_URL:-http://localhost:8080}
      REPORTS_DIR: /app/reports
      LOGS_DIR: /app/logs
      EVAL_RUNS: ${EVAL_RUNS:-20}
      CONCURRENT_JOBS: ${CONCURRENT_JOBS:-5}
      CELESTO_PRICE_PER_HOUR: ${CELESTO_PRICE_PER_HOUR:-0.015}
      MOCK_SEED: ${MOCK_SEED:-7}
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ledger_data:
